# VibiusMaximus: Windows-only build. Runs when started by hand or when a
# version tag (v*) is pushed; never on ordinary pushes, to save Actions minutes.
# Produces NSIS and MSI installers (not code-signed) as workflow artifacts.
#
# A tag push also publishes a GitHub release with latest.json, which is what the
# in-app "Update" button reads. To ship: bump the version in tauri.conf.json,
# Cargo.toml and package.json, commit, then push a matching tag, e.g.
#   git tag v1.0.1 && git push origin v1.0.1
# Updates are signed with our key (secrets TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD); the public half is in tauri.conf.json.
name: VibiusMaximus Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: vibe-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # The updater only offers versions newer than the installed one, so a
      # tag that doesn't match the app version would publish a dead release.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match app version ${version} in tauri.conf.json"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Same as Handy: link Microsoft's baseline ONNX Runtime (SSE2 + runtime
      # dispatch) so the app starts on pre-Haswell CPUs too.
      - name: Install ONNX Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ORT_VERSION = "1.24.2"
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-win-x64-$ORT_VERSION.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          Expand-Archive -Path ort.zip -DestinationPath ort-dist -Force
          $ortLib = (Resolve-Path "ort-dist/onnxruntime-win-x64-$ORT_VERSION/lib").Path
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_LIB_LOCATION=$ortLib"
          Add-Content -Path $env:GITHUB_ENV -Value "ORT_PREFER_DYNAMIC_LINK=1"

      # Same as Handy: ship the VC++ runtime next to the exe so it starts on
      # machines without the Microsoft redistributable.
      - name: Locate VC++ runtime redist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -products * -property installationPath
          $redistVersion = (Get-Content (Join-Path $vsRoot "VC\Auxiliary\Build\Microsoft.VCRedistVersion.default.txt")).Trim()
          $archDir = Join-Path $vsRoot "VC\Redist\MSVC\$redistVersion\x64"
          $crt = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.CRT" | Sort-Object Name | Select-Object -Last 1
          $omp = Get-ChildItem $archDir -Directory -Filter "Microsoft.VC*.OpenMP" | Sort-Object Name | Select-Object -Last 1
          Add-Content -Path $env:GITHUB_ENV -Value "HANDY_VC_REDIST_DIRS=$($crt.FullName);$($omp.FullName)"

      - name: Download voice-activity model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources/models | Out-Null
          Invoke-WebRequest -Uri https://blob.handy.computer/silero_vad_v4.onnx -OutFile src-tauri/resources/models/silero_vad_v4.onnx

      - run: bun install

      - name: Tests
        shell: pwsh
        run: |
          bun src/board/compile.test.ts
          cd src-tauri
          cargo test --lib vibe

      # On a tag this also creates the release and uploads the installers,
      # their .sig files and latest.json. Started by hand, it only builds.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('VibiusMaximus {0}', github.ref_name) || '' }}
          releaseBody: "Installed already? Use **Check for updates** in the app. New install: download the `-setup.exe` below."
          updaterJsonPreferNsis: true

      - uses: actions/upload-artifact@v4
        with:
          name: VibiusMaximus-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
